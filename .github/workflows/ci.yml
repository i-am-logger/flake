name: CI

# Rewritten from a self-hosted pipeline that had never executed once: no runner
# was ever registered, so every run queued for GitHub's 48-hour limit and was
# cancelled. Nothing here is a port of that file — it is modelled on mynixos's
# ci-and-release.yml, which is green.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `secrets` is a PATH input pointing at /home/logger/.secrets, which exists on
  # the two NixOS hosts and nowhere else — no runner can fetch it. Every nix
  # command below overrides it with an empty directory, which is enough because
  # nothing CI evaluates reads a secret's CONTENT: sops decryption happens at
  # activation, not eval.
  SECRETS_OVERRIDE: --override-input secrets /tmp/ci-empty-secrets

jobs:
  # Cheapest first: a lint failure should not cost a Nix evaluation.
  lint:
    name: Lint (statix + deadnix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: statix
        run: nix run nixpkgs#statix -- check .
      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail $(git ls-files '*.nix')

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      # `nix fmt` is the repo's own formatter (nixpkgs-fmt). The workflow this
      # replaced ran `alejandra --check`, a DIFFERENT formatter that disagrees
      # with it on nearly every file — it had simply never run, so nobody found
      # out.
      - name: nix fmt --check
        run: |
          nix fmt . -- --fail-on-change 2>/dev/null || nix fmt .
          git diff --exit-code

  flake-check:
    name: Flake Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip on release-please's own PR and the release commit it merges: both
    # touch only version files, and the checks already passed underneath.
    if: |
      !(
        (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'chore(master): release')) ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, 'release-please--branches--master'))
      )
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org https://cache.nixos.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Restore and save the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', 'flake.lock') }}
          # No lock hash in the prefix, so a lockfile bump still restores the
          # previous store and evaluates only the delta.
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Restore everywhere, save only on master. GitHub caches are
          # ref-scoped: a PR reads master's entry but writes its own, so an
          # ungated save spends the repo's cache budget per open PR.
          save: ${{ github.ref == 'refs/heads/master' }}
          purge: ${{ github.ref == 'refs/heads/master' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
          gc-max-store-size-linux: 8G

      - name: Stand in for the secrets input
        run: mkdir -p /tmp/ci-empty-secrets

      # --no-build: this evaluates every configuration but does not realise the
      # system closures. Building yoga's and skyspy-dev's toplevels is what the
      # self-hosted runners were for; a hosted runner has 14 GB of disk and the
      # closures do not fit. Evaluation is what catches a broken module, which is
      # what changes here.
      #
      # vogix uses import-from-derivation, so even --no-build builds its template
      # derivation at EVAL time. That needs an x86_64-linux builder, which is why
      # this cannot be checked from the darwin host.
      - name: nix flake check
        run: nix flake check --no-build --print-build-logs $SECRETS_OVERRIDE

      # darwinConfigurations are a known-but-unchecked flake attribute, so
      # `nix flake check` never evaluates them. Named explicitly, or the Mac's
      # configuration is the one thing CI does not look at.
      - name: Evaluate every host
        run: |
          set -euo pipefail
          for h in yoga skyspy-dev; do
            echo "== $h =="
            nix eval $SECRETS_OVERRIDE --raw ".#nixosConfigurations.$h.config.networking.hostName"
            echo
          done
          echo "== aether5d-dev =="
          nix eval $SECRETS_OVERRIDE --raw '.#darwinConfigurations."aether5d-dev".config.networking.hostName'
          echo
